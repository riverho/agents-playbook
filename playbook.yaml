# ============================================================================
#  playbook.yaml — THE MASTER (the "fixation")
# ----------------------------------------------------------------------------
#  This file is the single anchor every agent re-reads at the start of every
#  loop iteration. It indexes everything else (skills, processes, scripts,
#  memory, artifacts) and defines the loop contract and guardrails.
#
#  Rule of the fixation: nothing supersedes this file. If another doc and this
#  file disagree, this file wins — then fix the other doc.
#
#  Everything referenced here is RELATIVE to this folder. The whole playbook is
#  carry-on: copy the folder anywhere and it still works.
# ============================================================================

name: agents-playbook
version: 0.8.0
description: >-
  A portable, agent-first playbook. Agents loop without friction: orient on the
  master, pick a task, run the matching skill/process, verify with executable
  acceptance checks, record, and roll records up into human reports — all
  inside this folder.

# Read this FIRST, every session. It teaches any agent how to operate the playbook.
entry: SKILL.md

# north_star — the ONE invariant this project drives toward. `pb anchor` re-injects it
# every turn, alongside the fixation. Phase-level goals live in memory/cycle.md and DO
# change; this does not. If this line changes, you are starting a different project.
north_star: >-
  Make "done" mean a verified exit code, not a claim — a portable loop an agent can carry
  into any repo, that survives context loss and never declares victory unchecked.

# ----------------------------------------------------------------------------
# fixation — invariants. Never violate these. They are what keeps the loop honest.
# ----------------------------------------------------------------------------
fixation:
  - Re-anchor to playbook.yaml at the start of every loop iteration. The master wins.
  - Act only inside this folder. The playbook is self-contained (carry-on).
  - Skills-first. If a skill in skills/index.yaml fits the task, follow it and its
    process. Only improvise when no skill exists — then write one (see SKILL.md).
  - Done means the task's acceptance_checks (shell commands) exit 0. `pb record
    --status done` runs them and refuses on failure. Exit codes, not prose.
  - Record every iteration to memory/journal.ndjson via `pb record`. No silent work.
  - Agent-first, human-second. Work against the machine records; roll them up into
    artifacts/reports/ for humans. Never hand-edit the journal.
  - Keep guardrails green. Run `pb validate` before and after acting.
  - Memory precedence — on project matters this folder (north_star + memory/) outranks the
    agent's own or host memory. Host memory is the past; the playbook is the present and
    future. On conflict, surface it; never silently follow host memory.
  - Open each phase with a cycle brief (memory/cycle.md, the five questions) and close it
    with `pb reflect`. The North Star is invariant; the cycle goal changes per phase.
  - Acceptance_checks must test the task's own artifacts — `pb validate` alone is not a task
    check. A gate that passes without the work being done is worse than no gate.
  - The engine and its consumers are SEPARATE LAYERS. `apps/` (the flow room) is an
    integration surface that CONSUMES the engine (`pb graph --json`, `pb state --json`); it is
    never a dependency of it. Engine work must not require, import, or gate on `apps/`, and the
    engine's own checks must pass with `apps/` absent. Dependence runs one way, never back.
  - Nothing outside this folder is part of this playbook. A task naming a path in another
    repository (a sibling checkout, a host app, another tree's `src-tauri`) is out of scope by
    construction — capture it as a proposal, never carry it as an engine card, and never let it
    hold a version open. Every card in a version must be closable inside this folder.

# ----------------------------------------------------------------------------
# paths — canonical layout. The CLI resolves everything relative to this file's
# folder, so the playbook stays relocatable.
# ----------------------------------------------------------------------------
paths:
  root: .
  scripts: scripts
  processes: processes
  skills: skills
  memory: memory
  artifacts: artifacts
  reports: artifacts/reports

# ----------------------------------------------------------------------------
# index — the master index of every moving part. `pb list` reads from the
# index files below.
# ----------------------------------------------------------------------------
index:
  cli: scripts/pb.mjs
  processes_index: processes/index.yaml
  skills_index: skills/index.yaml
  memory:
    project_memory: memory/project-memory.md   # durable numbered operating rules
    backlog: memory/backlog.yaml               # the task queue the loop pulls from
    journal: memory/journal.ndjson             # append-only machine record (agent-first)
    cycle: memory/cycle.md                     # the current phase brief (forward half of the loop)
    loops: memory/loops.yaml                   # active/closed loop epochs
    lessons: memory/lessons.ndjson             # structured reflections for smarter next loops
    processes: memory/processes.ndjson         # tracked long-running processes by loop
  artifacts:
    reports: artifacts/reports                 # human-facing rollups (generated)

# ----------------------------------------------------------------------------
# layers — OPTIONAL. Plan the repo in strata instead of only ordering tasks.
# A layer is a named altitude; its `gate` is a shell command that must exit 0
# before any task in a HIGHER layer may be claimed. That is what turns "we do not
# touch the domain while the data layer is red" into an enforced fact.
#
# A task opts in with `layer: <id>`. The layer a task LANDS in is DERIVED from its
# dependencies (1 + its deepest dependency), and the declared value is a constraint:
# `pb validate` fails if a task sits in an earlier layer than something it depends
# on, or names a layer that is not declared here. Inspect it any time with
#   pb plan --layers                     # dry run: gates/blockers/order/critical path
#   pb plan --layers --check-gates       # same, and actually run the gate commands
# Tasks with no `layer:` are unconstrained in BOTH directions — no gate holds them
# back and they hold nothing back — so layers can be adopted incrementally.
# There is deliberately no switch to relax the partition: the declared order IS the
# claim the plan makes. `--force` is the explicit, recorded one-off escape hatch.
#
# This playbook DECLARES layers (adopted 2026-10-10, phase 42). Three strata, each with a gate
# that the claim path and `pb plan --layers --check-gates` execute. The gates are deliberately
# FAST and DETERMINISTIC: a gate runs on every claim, an unverified gate blocks a claim, and a
# gate that fails transiently freezes every stratum above it. The first L0 gate chosen here was
# `test-concurrency-state.mjs`, a timing-sensitive stress suite — GREEN standalone (29/29), RED
# under concurrent build load, which silently made L1 unclaimable and sent a teammate to the wrong
# task. A flaky gate is worse than a weaker deterministic one: it teaches everyone to distrust red.
# The stress suite still runs inside `npm test`, where a transient failure is visible without
# partitioning the plan.
#   L0 substrate   — state, locks, claims, journal replay, gate machinery
#   L1 surfaces    — CLI/JSON/plugin/adapter surfaces built on that substrate
#   L2 orchestration — flows, modes, autonomous runs, release and cross-repo work
layers:
  - {id: L0, name: substrate, about: "state, locks, claims, journal replay, gate machinery", gate: "node scripts/test-repair-terminal-release.mjs"}
  - {id: L1, name: surfaces, about: "CLI, JSON, plugin and adapter surfaces on the engine", gate: "node scripts/pb.mjs validate"}
  - {id: L2, name: orchestration, about: "flows, modes, autonomous runs, release and cross-repo work"}

# `human: true` on a layer declares that its gate fails until a PERSON acts (buy the
# domain, provision the database) — never something an agent retry can clear:
#   - {id: L0, name: infra, human: true, gate: "curl -fsS $APP_URL/health"}
# It changes reporting and hand-off, never whether the gate gates. A failing gate
# blocks only its own branch (work AT that layer and in unrelated branches stays
# claimable), and `pb plan --layers --check-gates` collects every human-gated layer
# into ONE batch — the gate command, and every task it holds up — so a single
# hand-off answers them all instead of the loop stopping at the first. `pb loop run
# --auto` reports that batch and ends `stalled` rather than claiming completion.
# ----------------------------------------------------------------------------

# ----------------------------------------------------------------------------
# modes — persona packs mounted ON the invariant floor. A mode injects a
# `directive` (persona text) + style `principles` through the anchor; it NEVER
# weakens enforcement. The floor (claim -> process/skill -> eval -> done ->
# cycle) is invariant — there is no mode that skips acceptance_checks.
# `default_mode` is the mode in effect when a task/loop names none.
# Resolution order: task.mode ?? loop.mode ?? default_mode.
# coding is the first/reference mode; its directive is empty (= inherit host prompt).
# ----------------------------------------------------------------------------
# ----------------------------------------------------------------------------
# update — self-update source. `pb update` pulls the latest engine from this repo's
# GitHub releases and overlays engine files, preserving user state (memory/, artifacts/).
# ----------------------------------------------------------------------------
update:
  repo: riverho/agents-playbook

default_mode: coding
# The reference mode pb-daily-monitor.mjs uses when invoked with no --mode. Declared
# here (not baked into the engine) so the orchestrator carries no specific pack's id.
default_monitor_mode: blogwatch
modes:
  coding: modes/coding.yaml
  # demo — a second pack that mounts purely from YAML (its own skill + process under
  # modes/demo/). The existence proof that a non-coding pack needs ZERO engine change.
  demo: modes/demo.yaml
  # blogwatch — monitoring persona for blogwatcher feeds + x.com (Twitter).
  # A full Stage-2 pack with its own skill + process; mounts purely from YAML.
  blogwatch: modes/blogwatch.yaml
  # fable-5 — the Fable 5 operating persona (verification/scope/judgment discipline).
  # A persona mode: inherits the global engine skills; the persona lives in its directive.
  fable-5: modes/fable-5.yaml
  # wiki-news — daily LLM Wiki news maintenance from blogwatcher + RSS sources.
  # A Stage-2 pack with its own skill/process scaffold and verification wrapper.
  wiki-news: modes/wiki-news.yaml
  # attention-research — reusable daily research digest mode; project scaffolds own concrete cron inputs.
  attention-research: modes/attention-research.yaml
  # fleet — the always-on orchestrator of a long-lived agent fleet (v0.8). Serves the
  # Flow room (`pb ui`), reads the backlog's comment rows every pass, classifies every
  # block and defers human-in-the-loop work instead of idling the fleet. A pack:
  # modes/fleet/ carries the fleet-orchestration skill + process. Driven by `pb tick`,
  # not by item scaffolding, so it declares no `scaffold` block by intent.
  fleet: modes/fleet.yaml

# ----------------------------------------------------------------------------
# loop — the friction-free contract. One command per step. SKILL.md expands this.
# ----------------------------------------------------------------------------
loop:
  description: Orient → Select → Act → Verify → Record → Report → repeat.
  # ---------------------------------------------------------------------------
  # stop_when — the terminal state. OPTIONAL, and the missing half of the contract.
  #
  # The loop above says how to keep going; nothing said how to STOP. A phase's stop
  # condition lived in memory/cycle.md as PROSE, which `pb anchor` printed and no
  # command ever evaluated — so an instruction-following agent had no observable
  # "done", answered the next injected banner, and the loop had no end. The cost was
  # turns, not CPU (see artifacts/debrief-pb-optimization-2026-10-13.md, Part 0).
  #
  # This is an EXECUTABLE command, exactly like a task's `acceptance_checks`:
  # cwd = playbook root, exit 0 = the phase's goal is met. Exit codes, not prose.
  #
  #   pb stop-check          run it and print the verdict
  #   pb stop-check --json   the same verdict, machine-readable
  #
  # A PROSE value is a GUARDRAIL FAILURE (`pb validate` exits non-zero), not a warning:
  # an unenforceable condition is the same as no condition, which is the defect itself.
  # Absent means "this playbook has not adopted a stop condition" and is not an error —
  # but an idle backlog is still reported inert, so a finished phase stops asking.
  #
  # stop_action — what a GREEN check means the caller should do, from a closed vocabulary:
  #   idle        say nothing and wait for a human (the default)
  #   report      roll the journal up into an artifact, then idle
  #   close-cycle run `pb reflect` to close the phase, then idle
  #   ask-human   surface one question and hand back
  # It is read by `pb anchor --brief` and the harness integration; it never gates work.
  # ---------------------------------------------------------------------------
  stop_when: "node scripts/check-phase-stop.mjs"
  stop_action: idle
  # ---------------------------------------------------------------------------
  # gate_tiers — the two speeds of "is this phase finished?".
  #
  # v0.8.0's stop condition ran the WHOLE suite. Measured on this repo: 327s across 77
  # commands, of which seven timeout/kill suites alone are 188s (58%). That is a fair price
  # at a phase boundary and an impossible one on the per-turn path: `pb status --json` feeds
  # the harness's per-STEP context injection, so the check deciding "may the loop continue?"
  # was costing minutes per step. The verdict was cached on the journal seq to make the
  # harness usable at all — a mitigation, not a design guarantee.
  #
  # So the question is split in two, which is the whole point:
  #   fast — "may the loop continue?" Structural health + the terminal-state contract.
  #          Runs on the per-turn / banner path. Budget: seconds, not minutes.
  #   full — "is this repo sound?" The whole suite. Runs at phase boundaries: a release,
  #          `pb version close`, a deliberate `pb stop-check --full`.
  #
  # `pb stop-check` defaults to the FAST tier; `--full` opts into the other. A version's
  # `stop_checks` are the full tier by definition, because closing a version IS a boundary.
  # ---------------------------------------------------------------------------
  gate_tiers:
    fast:
      description: The per-turn path — structural guards plus the terminal-state contract.
      budget_ms: 20000
      commands:
        - node scripts/pb.mjs validate
        - node scripts/test-stop-when.mjs
        - node scripts/test-dry-run-is-inert.mjs
        - node scripts/test-release-blocked-card.mjs
        - node scripts/test-dsh-inert-banner.mjs
    full:
      description: The phase boundary — the whole suite, plus the room's own gates.
      commands:
        - npm test
        - node scripts/check-flow-room-app.mjs
  steps:
    - id: orient
      do: Re-anchor. Read this master + memory/project-memory.md, then snapshot state.
      command: node scripts/pb.mjs status
    - id: select
      do: Pick the next actionable task and learn which skill/process to use.
      command: node scripts/pb.mjs next --claim
    - id: act
      do: Open skills/<skill>/SKILL.md and follow processes/<process>.yaml step by step.
      command: null   # human/agent work, guided by the skill + process
    - id: verify
      do: Run structural guardrails plus the task's executable acceptance_checks.
      command: node scripts/pb.mjs validate && node scripts/pb.mjs validate --task <id>
    - id: record
      do: Append a structured entry. Recording done re-runs the checks and refuses on failure.
      command: node scripts/pb.mjs record --task <id> --action <action> --status <status> --notes "<what+why>"
    - id: report
      do: Periodically roll the journal up into a human-readable report artifact.
      command: node scripts/pb.mjs report

# ----------------------------------------------------------------------------
# orchestrator — the cron pass (`pb tick`). The host owns the schedule; pb owns the
# pass. It releases quiet claims, asks a person, routes around stuck work and
# PROPOSES the next task. It never starts agents, decides, merges or closes a version.
# ----------------------------------------------------------------------------
orchestrator:
  every_minutes: 15          # how often the host should run `pb tick`
  max_workers: 0             # 0 = propose only (spending is undecided, D27)
  stale_claim_minutes: 30    # a claim with no journal row this long is released
  reprompt_minutes: [60, 240, 1440]   # re-ask a question 1 h, 4 h, 1 day after the first ask
  paused: false

# ----------------------------------------------------------------------------
# guardrails — lightweight. `pb validate` enforces the structural ones; the rules
# below are the human-judgment ones every agent is expected to honor.
# ----------------------------------------------------------------------------
guardrails:
  validate_command: node scripts/pb.mjs validate
  rules:
    - The master, both index files, and every file they reference must exist and parse.
    - Every skill must point to a real process; every backlog item must have a valid status.
    - acceptance_checks are executable shell commands (cwd = playbook root, exit 0 = pass).
      Give every task checks where possible — a task without them is verified on honor only.
    - Every journal line must be valid JSON (use `pb record`, never hand-edit).
    - One task in_progress at a time per agent. Finish or block it before claiming another.
    - Prefer the smallest change that satisfies the task's acceptance_checks.
  allowed_statuses: [todo, in_progress, blocked, done]

# ----------------------------------------------------------------------------
# hardening — how the playbook survives context loss (long sessions, compaction,
# handoff). Principle: context loss must never mean work loss. State lives on
# disk; re-anchor cheaply; auto-re-inject. See skills/harden.
# ----------------------------------------------------------------------------
hardening:
  principle: Externalize state to disk + re-anchor cheaply + auto-re-inject the anchor.
  commands:
    anchor: node scripts/pb.mjs anchor          # tiny constitution — safe to re-inject every turn
    checkpoint: node scripts/pb.mjs checkpoint   # heartbeat + drift detection
  re_anchor: Call anchor at the start of every iteration and after every few actions.
  auto_inject:
    claude_code:
      note: Agents hand hook JSON to the human; do not write .claude/settings.json themselves.
      SessionStart: node scripts/pb.mjs anchor
      UserPromptSubmit: node scripts/pb.mjs anchor --brief
      PreCompact: node scripts/pb.mjs checkpoint --snapshot
    opencode:
      note: >-
        Implemented by the adapter plugin in adapters/opencode/. OpenCode owns the
        cadence (session.idle); the playbook owns the contract (pb checks). The plugin
        drives `pb loop run --auto --defer-blocked` on idle and stamps multi-agent
        identity (PB_RUNTIME=opencode, a session-scoped PB_AGENT_ID) on every shell —
        see adapters/opencode/README.md.
      session.created: node scripts/pb.mjs anchor
      session.idle: node scripts/pb.mjs checkpoint
      experimental.session.compacting: node scripts/pb.mjs anchor --brief
      shell.env: stamp PB_ROOT + PB_RUNTIME + PB_AGENT_ID (+ forwarded claim proof)
    other_runtimes: Wrap each turn with `node scripts/pb.mjs anchor --brief`; on resume run checkpoint.

# ----------------------------------------------------------------------------
# reporting — how agent-first records become human artifacts.
# ----------------------------------------------------------------------------
reporting:
  source: memory/journal.ndjson
  backlog: memory/backlog.yaml
  output_dir: artifacts/reports
  filename: report-<date>.md
  contains:
    - Summary counts (done / in_progress / blocked / todo).
    - Per-task timeline built from journal entries, including skipped and hollow-check markers.
    - Open backlog with priority, skill, and gate quality.
